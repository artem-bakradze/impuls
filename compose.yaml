services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impuls
      POSTGRES_PASSWORD: impuls
      POSTGRES_DB: impuls
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impuls"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
