services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impuls
      POSTGRES_PASSWORD: impuls
      POSTGRES_DB: impuls
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impuls"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Full local stand: `docker compose --profile app up -d --build` (see docs/development.md).
  # Apply migrations first: `pnpm db:migrate` with DATABASE_URL pointing at localhost:54329.
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://impuls:impuls@postgres:5432/impuls
      DIRECT_API_MODE: simulator
      # Free by default; `AGENT_RUNTIME=openai CREATIVES=openai` with OPENAI_* from the shell use the real models,
      # and the agent also needs its prices and spend limits (docs/deployment.md). `heuristic` is the free test agent.
      AGENT_RUNTIME: ${AGENT_RUNTIME:-idle}
      CREATIVES: ${CREATIVES:-template}
      OPENAI_API_KEY:
      OPENAI_TEXT_MODEL:
      OPENAI_IMAGE_MODEL:
      IMAGE_PRICE_RUB:
      IMAGE_MONTHLY_LIMIT:
      OPENAI_AGENT_MODEL:
      AGENT_PRICE_INPUT_RUB_PER_MTOK:
      AGENT_PRICE_OUTPUT_RUB_PER_MTOK:
      AGENT_MONTHLY_LIMIT_RUB:
      AGENT_SIMULATION_RUN_LIMIT_RUB:
      OPENAI_STRATEGY_MODEL:
      AGENT_STRATEGY_PRICE_INPUT_RUB_PER_MTOK:
      AGENT_STRATEGY_PRICE_OUTPUT_RUB_PER_MTOK:
      # HTTPS CONNECT proxy outside Russia for OpenAI (docs/deployment.md).
      OPENAI_PROXY_URL:
      # Behind a fake-IP VPN: e.g. https://dns.google/resolve (docs/development.md).
      PAGE_DNS_OVER_HTTPS_URL:
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Импульс <noreply@impuls.test>"
      APP_URL: http://localhost:3000
      TEAM_ALERT_EMAIL: team@impuls.test
      MINISITE_DIR: /data/minisites
    volumes:
      - minisites:/data/minisites
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Secrets are passed through from the host shell; when unset, web refuses to start and lists them.
    environment:
      - DATABASE_URL=postgres://impuls:impuls@postgres:5432/impuls
      - DIRECT_API_MODE=simulator
      - SUPPORT_EMAIL=support@impuls.test
      # Override when another local app holds localhost:3000, e.g. AUTH_URL=http://127.0.0.1:3000.
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET
      # Local stand only: `AUTH_TEST_LOGIN=enabled` adds the email-only login (refused with DIRECT_API_MODE=production).
      - AUTH_TEST_LOGIN
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started

  mailpit:
    profiles: ["app"]
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  minisites:
