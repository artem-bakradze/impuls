schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: «Импульс» — сервис автоматического управления рекламой для малого
  бизнеса (салоны красоты, йога-студии и т. п.). Пользователь — владелец бизнеса
  без маркетинговой экспертизы: описывает бизнес, задаёт бюджет, получает клиентов.
  Площадка MVP: только Яндекс Директ API v5 (разработка и тесты — на симуляторе рынка,
  песочница Директа отключена 15.07.2026; боевой API — для контрактных тестов и пилота). Аналитика: Яндекс Метрика. Вход: Google OAuth.
  Объём MVP — не больше, чем просит ТЗ заказчика: простота важнее дополнительных функций.
  Стек и правила работы с кодом — в AGENTS.md в корне репозитория.
  Принципы:
  - Решения по рекламе принимает агент на OpenAI Agents API, он включён по умолчанию и в симуляции
    решает всегда. Он действует только через инструменты сервиса и не может обойти ограничители и
    защиту бюджета. Детерминированные правила — страховка: они делают то, что агент пропустил, и
    решают сами, если агент выключен, недоступен или исчерпал лимит затрат. Итог A/B-теста, бюджет и
    ограничители — всегда детерминированный код. Тексты объявлений и варианты пишет языковая модель.
  - Пользователь видит решения инсайтами вместо графиков: что заметили, на каких данных (факты из
    снимка, числа проверяются), что решили и что дальше.
  - Месячный бюджет пользователя не превышается ни при каких условиях.
  - Каждое автоматическое действие объясняется простым языком и откатывается.
  - В пользовательских текстах нет рекламного жаргона.

rules:
  specs:
    - Every requirement has at least one scenario with measurable thresholds where applicable
  tasks:
    - Group tasks by capability; each task is completable and verifiable on its own
    - Business behavior is verified by BDD scenarios in tests/bdd (see AGENTS.md)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
