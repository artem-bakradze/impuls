name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: impuls
          POSTGRES_PASSWORD: impuls
          POSTGRES_DB: impuls
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U impuls"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://impuls:impuls@localhost:54329/impuls
      MAILPIT_SMTP_URL: smtp://localhost:1025
      MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm test:bdd
      - run: pnpm db:migrate
      - run: pnpm test:integration
